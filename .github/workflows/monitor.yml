name: Monitor ICP+ Madrid

on:
  schedule:
    # Toutes les 10 minutes.
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/monitor.yml'
      - 'check.mjs'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install WireGuard and MozWire
        id: vpn_tools
        continue-on-error: true
        env:
          MOZ_TOKEN: ${{ secrets.MOZ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MOZ_TOKEN" || { echo "MOZ_TOKEN secret is missing"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools curl
          curl -fsSL -o /tmp/mozwire https://github.com/NilsIrl/MozWire/releases/download/v0.8.1/mozwire-linux
          chmod +x /tmp/mozwire
          /tmp/mozwire --version

      - name: Connect Mozilla VPN through Madrid, Spain
        id: vpn
        if: steps.vpn_tools.outcome == 'success'
        continue-on-error: true
        env:
          MOZ_TOKEN: ${{ secrets.MOZ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mozilla-wg
          /tmp/mozwire device remove nie-query-github >/dev/null 2>&1 || true
          /tmp/mozwire relay save '^es-mad-wg-' -o /tmp/mozilla-wg -n 1 --tunnel ipv4 --name nie-query-github
          CONF="$(find /tmp/mozilla-wg -maxdepth 1 -type f -name '*.conf' | head -n 1)"
          test -n "$CONF" || { echo "No Madrid WireGuard configuration generated"; exit 1; }
          chmod 600 "$CONF"
          sudo wg-quick up "$CONF"
          COUNTRY="$(curl -4fsS --max-time 15 https://ipinfo.io/country | tr -d '\r\n')"
          echo "VPN exit country: $COUNTRY"
          test "$COUNTRY" = "ES"

      - name: Report VPN diagnostic
        if: always()
        run: |
          echo "vpn_tools outcome: ${{ steps.vpn_tools.outcome }}"
          echo "vpn outcome: ${{ steps.vpn.outcome }}"
          sudo wg show || true
          curl -4fsS --max-time 15 https://ipinfo.io/country || true

      - uses: actions/setup-node@v4
        if: steps.vpn.outcome == 'success'
        with:
          node-version: '22'

      - name: Install Node dependencies
        if: steps.vpn.outcome == 'success'
        run: npm install

      - name: Install Firefox
        if: steps.vpn.outcome == 'success'
        run: npx playwright install --with-deps firefox

      - name: Check ICP+ Madrid with Firefox
        if: steps.vpn.outcome == 'success'
        continue-on-error: true
        env:
          SEND_EMAIL: 'true'
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: npm run check

      - name: VPN unavailable
        if: steps.vpn_tools.outcome != 'success' || steps.vpn.outcome != 'success'
        run: echo "VPN indisponible. Aucun email d'alerte ICP+ envoyé."

      - name: Disconnect VPN
        if: always()
        continue-on-error: true
        run: |
          CONF="$(find /tmp/mozilla-wg -maxdepth 1 -type f -name '*.conf' 2>/dev/null | head -n 1)"
          if [ -n "$CONF" ]; then sudo wg-quick down "$CONF" || true; fi
